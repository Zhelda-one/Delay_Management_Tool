<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timing Calculation Tool</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: #1f2937;
      color: white;
    }
    .topbar h1 {
      margin: 0;
      font-size: 20px;
    }
    .back-btn {
      display: inline-block;
      padding: 8px 14px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
    }
    .frame-wrap {
      width: 100%;
      height: calc(100vh - 56px);
      background: white;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Timing Calculation Tool</h1>
    <a href="/" class="back-btn">Back to Dashboard</a>
  </div>

  <div class="frame-wrap">
    <iframe src="{{ timing_url }}"></iframe>
  </div>
</body>
</html>
